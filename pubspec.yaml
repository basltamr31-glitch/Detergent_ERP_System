name: detergent_factory
description: Offline factory ERP with Arabic and English support for Android and Windows.
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  provider: ^6.1.1
  intl: ^0.20.2
  # المكتبات الأساسية لتوليد ملفات PDF والطباعة
  pdf: ^3.10.8
  printing: ^5.11.1
  path_provider: ^2.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # إضافة مكتبة الأيقونات هنا في قسم dev_dependencies
  flutter_launcher_icons: "^0.13.1"

# إعدادات الأيقونات يجب أن تكون في مستوى مستقل تماماً (أقصى اليسار)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  # إذا كنت ستستخدم اللوجو داخل الـ PDF، تأكد من إضافة المسار هنا أيضاً
  assets:
    - assets/icon/app_icon.png

  fonts:
          - family: Cairo
            fonts:
              - asset: assets/fonts/Cairo-Regular.ttf
              - asset: assets/fonts/Cairo-Bold.ttf
                weight: 700
